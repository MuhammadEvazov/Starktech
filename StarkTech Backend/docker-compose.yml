# Фиксированное имя проекта: без него compose берёт имя папки ("starktechbackend")
# и создаёт новые пустые тома вместо существующих starktech_starktech_*.
name: starktech

services:
  postgres:
    image: postgres:17-alpine
    container_name: starktech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: starktech
      POSTGRES_USER: postgres
      # Пароль берётся из переменной окружения / файла .env рядом с compose (POSTGRES_PASSWORD=...).
      # Значение по умолчанию — только для локальной разработки; на сервере обязательно задайте свой.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-654321}"
    ports:
      # 2004 belongs to the local Windows PostgreSQL service, 5433 to amarcrm-postgres
      # Только localhost: база не должна быть доступна из сети.
      - "127.0.0.1:5434:5432"
    volumes:
      - starktech_pg17data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d starktech"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: starktech-redis
    restart: unless-stopped
    ports:
      # Redis без пароля (requirepass не задан) — поэтому порт открыт только на localhost.
      # Если Redis понадобится снаружи — сначала включите requirepass и пароль в строке подключения.
      - "127.0.0.1:6380:6379"
    volumes:
      - starktech_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  starktech_pg17data:
  starktech_redisdata:
